<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rakeback</title>
<style>
  :root{
    --bg:#0D1712; --bg2:#0A120E; --card:#152019; --card2:#1B2A21; --line:#25382C;
    --ink:#ECF3ED; --ink2:#9FB5A7; --ink3:#6C8375;
    --ouro:#E4BE6E; --ouro-fundo:#3A2E17;
    --verde:#57CC93; --verde-fundo:#173226;
    --alerta:#E4A855; --alerta-fundo:#3A2C14;
    --info:#7FB3D9; --info-fundo:#152735;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at top,var(--bg) 0%,var(--bg2) 70%);
       color:var(--ink);font-family:var(--sans);padding:22px 14px 60px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:600px;margin:0 auto}
  .cabecalho{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:25px;margin:0;letter-spacing:-.02em;font-weight:750}
  .periodo{color:var(--ink2);font-size:13.5px;margin-top:5px}
  .frescor{text-align:right;font-size:11px;color:var(--ink3);white-space:nowrap;
           padding-top:4px}
  .frescor b{color:var(--ink2);display:block;font-size:12px}
  .frescor .ponto{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--verde);margin-right:4px;vertical-align:middle}
  .frescor.velho b{color:var(--alerta)}
  .frescor.velho .ponto{background:var(--alerta)}
  .aviso-geral{margin:16px 0 20px;padding:11px 14px;background:var(--card2);
         border-left:3px solid var(--ouro);border-radius:3px;
         font-size:12.5px;color:var(--ink2);line-height:1.5}
  .jog{background:var(--card);border:1px solid var(--line);border-radius:12px;
       margin-bottom:11px;overflow:hidden}
  .jog-topo{display:flex;justify-content:space-between;align-items:center;
            gap:12px;padding:15px 17px;cursor:pointer;user-select:none}
  .jog-nome{font-size:17px;font-weight:650}
  .jog-nome .n-alertas{display:inline-block;margin-left:7px;width:8px;height:8px;
       border-radius:50%;background:var(--alerta);vertical-align:middle}
  .jog-valor{font-family:var(--mono);font-size:22px;font-weight:750;color:var(--verde);
         font-variant-numeric:tabular-nums;white-space:nowrap}
  .jog-resumo{display:flex;gap:14px;flex-wrap:wrap;padding:0 17px 14px;
           font-size:12px;color:var(--ink3)}
  .jog-resumo b{color:var(--ink2);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .seta{display:inline-block;font-size:11px;color:var(--ink3);transition:transform .15s}
  .jog.aberto .seta{transform:rotate(90deg)}
  .detalhe{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .jog.aberto .detalhe{max-height:600px}
  .detalhe-int{border-top:1px solid var(--line);padding:13px 17px 15px}
  .conta-bloco{padding:8px 0;border-top:1px solid var(--line)}
  .conta-bloco:first-child{border-top:none;padding-top:0}
  .conta-linha{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap}
  .conta-id{font-family:var(--mono);color:var(--ink3);font-size:11px;min-width:80px}
  .conta-nome{flex:1;min-width:100px;color:var(--ink2)}
  .conta-val{font-family:var(--mono);font-size:12.5px;color:var(--ink2);
             font-variant-numeric:tabular-nums}
  .conta-partes{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;padding-left:2px;
       font-size:11px;color:var(--ink3)}
  .conta-partes b{color:var(--ink2);font-family:var(--mono);font-variant-numeric:tabular-nums;
       font-weight:600}
  .conta-partes .zerado{opacity:.45}
  .selo-quando{font-size:10.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
  .selo-quando b{color:var(--ink2);font-weight:600}
  .selo{font-size:10.5px;padding:2px 8px;border-radius:9px;font-weight:650;
        display:block;margin-top:5px;width:fit-content}
  .selo.vencido{background:var(--alerta-fundo);color:var(--alerta)}
  .selo.parado{background:var(--info-fundo);color:var(--info)}
  .conf{font-size:11.5px;color:var(--ink3);margin-top:10px;padding-top:10px;
        border-top:1px dashed var(--line)}
  .vazio{padding:34px 16px;text-align:center;color:var(--ink3);font-size:14px}
  .rodape{margin-top:24px;color:var(--ink3);font-size:11px;line-height:1.6;
          border-top:1px solid var(--line);padding-top:14px}
  .filtro{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:14px 16px;margin:16px 0 14px}
  .filtro-datas{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .campo{flex:1;min-width:132px}
  .campo label{display:block;font-size:11px;color:var(--ink3);margin-bottom:5px;
               text-transform:uppercase;letter-spacing:.05em}
  .campo input{width:100%;background:var(--card2);border:1px solid var(--line);
       color:var(--ink);border-radius:8px;padding:9px 10px;font-size:14px;
       font-family:var(--sans);min-height:42px}
  .campo input:focus{outline:2px solid var(--verde);outline-offset:1px}
  /* O icone do calendario nativo vem escuro e some no fundo preto. */
  .campo input[type=date]::-webkit-calendar-picker-indicator{
       filter:invert(1) brightness(1.6);cursor:pointer;opacity:.85}
  .campo input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}

  .atalhos{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .atalhos button{background:var(--card2);border:1px solid var(--line);color:var(--ink2);
       border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;
       font-family:var(--sans);min-height:34px}
  .atalhos button:hover{border-color:var(--verde);color:var(--verde)}
  .atalhos button.ativo{background:var(--verde);border-color:var(--verde);color:#0A120E;
       font-weight:650}
  .atalhos button:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

  /* Atalhos discretos (Hoje / 7 dias / Tudo): existem, mas nao disputam
     atencao com a semana atual, que e a pergunta que o jogador realmente tem. */
  .atalhos button.discreto{background:transparent;border-color:transparent;
       color:var(--ink3);font-size:11.5px;padding:5px 9px;min-height:28px;
       text-decoration:underline;text-underline-offset:3px}
  .atalhos button.discreto:hover{color:var(--verde);border-color:transparent}
  .atalhos button.discreto.ativo{background:transparent;color:var(--verde);
       border-color:transparent;font-weight:650;text-decoration:none}

  /* Janela curta -- termometro do que esta sendo gerado agora. */
  .atalhos-curtos{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .atalhos-curtos button{background:var(--card2);border:1px solid var(--line);
       color:var(--ink2);border-radius:20px;padding:6px 13px;font-size:12.5px;
       cursor:pointer;font-family:var(--sans);min-height:34px}
  .atalhos-curtos button:hover{border-color:var(--ouro);color:var(--ouro)}
  .atalhos-curtos button.ativo{background:var(--ouro);border-color:var(--ouro);
       color:#170F02;font-weight:650}
  .atalhos-curtos button:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

  /* Regressiva mora no topo, colada no cabecalho -- nao precisa de cartao
     proprio. Nenhuma faixa desta pagina mostra valor agregado (ver
     renderContexto): a soma dos jogadores e informacao da promotoria. */
  .regressiva-topo{font-size:12.5px;color:var(--ink2);margin:-2px 0 16px;
       font-variant-numeric:tabular-nums}
  .regressiva-topo b{color:var(--verde)}
  .regressiva-topo:empty{display:none}

  /* Rotulo de grupo dos botoes: separa "que periodo" de "agora". */
  .grupo-rot{font-size:10.5px;color:var(--ink3);text-transform:uppercase;
       letter-spacing:.09em;font-weight:650;margin:0 0 7px}
  .grupo-rot + .atalhos, .grupo-rot + .atalhos-curtos{margin-top:0}
  .atalhos + .grupo-rot, .atalhos-curtos + .grupo-rot{margin-top:15px}

  .curto-custom{display:flex;align-items:center;gap:6px;font-size:12.5px;
       color:var(--ink2);flex-wrap:wrap}
  .curto-custom input{width:62px;background:var(--card2);border:1px solid var(--line);
       color:var(--ink);border-radius:8px;padding:8px 9px;font-size:14px;
       font-family:var(--sans);min-height:40px}
  .curto-custom input:focus{outline:2px solid var(--ouro);outline-offset:1px}
  .curto-custom button{background:var(--card2);border:1px solid var(--line);
       color:var(--ink2);border-radius:20px;padding:7px 16px;font-size:12.5px;
       cursor:pointer;font-family:var(--sans);min-height:40px;margin-left:4px}
  .curto-custom button:hover{border-color:var(--ouro);color:var(--ouro)}
  .curto-custom button:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

  /* Faixa de contexto: so texto, explicando o que esta na tela. */
  .contexto{background:var(--card);border:1px solid var(--line);
       border-left:3px solid var(--verde);border-radius:9px;padding:12px 15px;
       margin:14px 0 16px;font-size:13px;color:var(--ink2);line-height:1.6}
  .contexto.curto{border-left-color:var(--ouro)}
  .contexto b{color:var(--ink)}
  .contexto:empty{display:none}

  /* Bloco de ajuda do rodape -- e importante, entao nao pode ficar apagado
     a ponto de passar despercebido (aconteceu com o Erick). */
  .ajuda{margin-top:30px;background:var(--card);border:1px solid var(--line);
       border-radius:11px;padding:16px 18px}
  .ajuda-tit{font-size:13.5px;font-weight:650;color:var(--ink);margin-bottom:8px}
  .ajuda #rodape{font-size:13px;color:var(--ink2);line-height:1.65;
       border:none;padding:0;margin:0;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="cabecalho">
    <div>
      <h1>Rakeback</h1>
      <div class="periodo" id="periodo"></div>
    </div>
    <div class="frescor" id="frescor"><b id="frescorval"></b><span id="frescorobs"></span></div>
  </div>
  <div class="regressiva-topo" id="regressiva"></div>

  <div class="filtro">
    <div class="grupo-rot">Período</div>
    <div class="atalhos" id="atalhos"></div>
    <div class="grupo-rot">Agora</div>
    <div class="atalhos-curtos" id="atalhoscurtos">
      <span class="curto-custom">
        <input type="number" id="ch" min="0" max="24" step="1" value="6" aria-label="horas">
        <span>h</span>
        <input type="number" id="cm" min="0" max="55" step="5" value="0" aria-label="minutos">
        <span>min</span>
        <button type="button" id="btaplicar">ver</button>
      </span>
    </div>
    <div class="grupo-rot">Entre duas datas</div>
    <div class="filtro-datas">
      <div class="campo">
        <label for="de">De</label>
        <input type="date" id="de">
      </div>
      <div class="campo">
        <label for="ate">Até</label>
        <input type="date" id="ate">
      </div>
    </div>
  </div>

  <div class="contexto" id="contexto"></div>

  <div id="lista"></div>
  <div class="ajuda">
    <div class="ajuda-tit">Como esta página se atualiza</div>
    <div id="rodape"></div>
  </div>
</div>

// A semana de apuracao fecha no DOMINGO e o repasse e na segunda. Este atalho

// qualquer dia que o jogador clicar -- e o numero que vai ser pago. Sem isso o
// jogador clicava em "ultimos 7 dias" na segunda e via segunda-a-segunda, que
// da outro valor e gera a duvida "por que ta diferente do que voces falaram".
function ultimaSemanaFechada(){
  const hoje = new Date(HOJE + "T12:00:00");
  const diaSemana = hoje.getDay();          // 0=domingo, 1=segunda
  // Volta ate o domingo mais recente que ja passou (se hoje e domingo, ele

  const recuoAteDomingo = diaSemana === 0 ? 7 : diaSemana;
  const domingo = new Date(hoje);
  domingo.setDate(hoje.getDate() - recuoAteDomingo);
  const segunda = new Date(domingo);
  segunda.setDate(domingo.getDate() - 6);
  return [iso(segunda), iso(domingo)];
}

// --- Fuso: TUDO que tem hora nesta pagina e horario de Brasilia ---
//
// O servidor do TrucoVamos corta o dia e fecha a semana a meia-noite de
// Brasilia, para todo mundo, em qualquer fuso. Entao a pagina nao pode usar o
// relogio do navegador: um jogador em Cuiaba veria a semana fechar 23:00 e um
// em Fernando de Noronha 01:00. Fixando -3, todos veem o mesmo prazo -- que e

const FUSO_BR = -3;

// metodos getUTC* de proposito: deslocamos o instante e lemos em UTC, que e o
// unico jeito de nao deixar o fuso do navegador entrar na conta.
function emBrasilia(ms){ return new Date(ms + FUSO_BR * 3600000); }

// Instante (ms) em que a semana ATUAL fecha: domingo 23:59:59.999 de Brasilia.
function fimDaSemanaAtual(){
  const agoraBR = emBrasilia(Date.now());
  const diaSemana = agoraBR.getUTCDay();              // 0=domingo
  const faltamDias = diaSemana === 0 ? 0 : 7 - diaSemana;
  const fim = new Date(agoraBR);
  fim.setUTCDate(agoraBR.getUTCDate() + faltamDias);
  fim.setUTCHours(23, 59, 59, 999);
  return fim.getTime() - FUSO_BR * 3600000;           // volta pra instante real
}

// A semana atual em datas (segunda a domingo), pra somar a serie diaria.
function semanaAtual(){
  const agoraBR = emBrasilia(Date.now());
  const diaSemana = agoraBR.getUTCDay();
  const recuo = diaSemana === 0 ? 6 : diaSemana - 1;  // volta ate a segunda

  domingo.setUTCDate(segunda.getUTCDate() + 6);

    render();
  }));

// Os botoes rapidos e o campo livre ficam na MESMA linha de propósito: sao a
// mesma familia (janela que termina agora), e separa-los deixava a linha
// "Agora" curta e desequilibrada em relacao a de cima. Ja "entre duas datas" e
// outra familia -- intervalo fechado no passado -- e continua escondida, por
// ser a parte mais pesada da tela (dois calendarios).
// Rotulo curto de proposito: a linha ja esta sob o titulo "Agora" e ao lado
// do campo livre (que tem "h"/"min" escritos) -- "ultimas" vira redundante.
document.getElementById("atalhoscurtos").insertAdjacentHTML("afterbegin",
  JANELAS_CURTAS.map(h => `<button type="button" data-h="${h}">${h}h</button>`).join(""));

document.querySelectorAll("#atalhoscurtos button[data-h]").forEach(b =>
  b.addEventListener("click", () => {
    janelaCurtaAtiva = +b.dataset.h;
    render();
  }));

document.getElementById("btaplicar").addEventListener("click", () => {
  const h = Math.min(24, Math.max(0, +document.getElementById("ch").value || 0));
  // Arredonda pro balde de 5 min: pedir "3 min" daria uma janela sem sentido,
  // ja que a menor unidade que a gente guarda e 5 minutos.
  const m = Math.min(55, Math.max(0, Math.round((+document.getElementById("cm").value || 0) / 5) * 5));
  document.getElementById("cm").value = m;
  const total = Math.min(24, h + m / 60);
  if (total <= 0) return;
  janelaCurtaAtiva = total;
  render();
});

// Agora tudo vem da MESMA fonte (comissao_evento, com categoria e hora), entao
// as duas informacoes nao podem mais se contradizer: "nao gera servico desde
// 13/08 20:55" e "jogou por ultimo 23/08 15:23" sao dois carimbos do mesmo
// relogio. A contagem de dias e de CALENDARIO -- e o que a pessoa conta na
// cabeca. (A deteccao continua olhando dias com atividade, pra fim de semana
// sem jogar nao virar alarme.)
function rotuloQuando(ts){
  const [dia, hora] = ts.split(' ');
  const hm = (hora || '').slice(0,5);
  const difDias = Math.round((new Date(HOJE + 'T12:00:00') - new Date(dia + 'T12:00:00')) / 86400000);
  if (difDias === 0) return `hoje ${hm}`;
  if (difDias === 1) return `ontem ${hm}`;
  return `${dt(dia)} ${hm}`;
}

function detalheQuando(st){
  if (!st) return '';
  const partes = [];
  const ausente = st.chave === 'convite_vencido' ? 'indicação' : 'serviço';
  if (st.chave === 'convite_vencido' && st.ultimo_convite) {
    partes.push(`última ${ausente} em <b>${rotuloQuando(st.ultimo_convite)}</b>`);
  } else if (st.ultimo_servico) {
    partes.push(`último ${ausente} em <b>${rotuloQuando(st.ultimo_servico)}</b>`);
  }
  if (st.dias != null) {
    partes.push(st.dias === 1 ? 'há 1 dia' : `há ${st.dias} dias`);
  }
  if (st.ultima_atividade) {
    partes.push(`jogou por último <b>${rotuloQuando(st.ultima_atividade)}</b>`);
  }
  return partes.length ? `<div class="selo-quando">${partes.join(' · ')}</div>` : '';
}

function somarPeriodo(serie, ini, fim){
  // serie: {"2026-08-12": [servico, saque, convite], ...}
  let s = 0, q = 0, c = 0;
  for (const dia in serie){
    if (dia >= ini && dia <= fim){
      const v = serie[dia];
      s += v[0]; q += v[1]; c += v[2];
    }
  }
  return {servico: s, saque: q, convite: c, total: s + q + c};
}

// Soma os baldes de 5 min das ultimas N horas.
//
// IMPORTANTE -- por que isso NAO devolve "valor a receber": o fluxo de eventos
// so carrega servico e convite. Saque nao tem evento e so fecha por dia. Como
// o acordo de rakeback incide sobre os tres, uma janela de 3h que mostrasse
// "seu rakeback" nasceria incompleta -- e o jogador tem como perceber. Entao
// aqui a janela curta e TERMOMETRO ("esta rendendo agora") e o saque aparece a
// parte, marcado como do dia.
//
// A janela termina em D.balde_ate (o momento da ultima coleta), nao no relogio
// de quem abre: senao os ultimos ~15 min ate a proxima atualizacao apareceriam
// como zero, e isso se leria como "parei de gerar".
function somarBaldes(baldes, horas){
  // A janela e ALINHADA AOS BALDES de proposito. Cortar no segundo exato
  // (ate - 3h) descartaria o balde que comecou pouco antes do corte, e com
  // ele todos os eventos daquele balde que estavam DENTRO da janela -- deu
  // 1,69 a menos num teste real, so por causa de 57 segundos de desalinho.
  // Ancorando no inicio do balde, a janela pode cobrir ate 5 min a mais, mas
  // nunca perde nada. Pra um termometro, sobrar e melhor que faltar.
  const fim = Math.floor(D.balde_ate / D.balde_seg) * D.balde_seg;
  const desde = fim - horas * 3600;
  let s = 0, c = 0;
  for (const [off, sv, cv] of (baldes || [])){
    const t = D.balde_base + off * D.balde_seg;
    if (t >= desde){ s += sv; c += cv; }
  }
  return {servico: s, convite: c, total: s + c};
}

function hhmmBR(ms){
  const d = emBrasilia(ms);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}

function render(){
  const curta = janelaCurtaAtiva;
  let ini = de.value, fim = ate.value;
  if (!curta){
    if (!ini || !fim) return;
    if (ini > fim) { [ini, fim] = [fim, ini]; de.value = ini; ate.value = fim; }
  }

  document.getElementById("periodo").textContent = curta
    ? `últimas ${textoJanela(curta)} — até ${hhmmBR(D.balde_ate * 1000)}`
    : `${dt(ini)} a ${dt(fim)}`;

  // marca o atalho que bate exatamente com o intervalo atual
  document.querySelectorAll("#atalhos button").forEach(b => {
    const a = ATALHOS[+b.dataset.i];
    b.classList.toggle("ativo", !curta && a.de() === ini && a.ate() === fim);
  });
  document.querySelectorAll("#atalhoscurtos button").forEach(b => {
    b.classList.toggle("ativo", curta === +b.dataset.h);
  });

  const linhas = D.jogadores.map(j => {
    const contas = j.contas.map(c => curta
        ? {...c, ...somarBaldes(c.baldes, curta), saque: 0}
        : {...c, ...somarPeriodo(c.serie, ini, fim)})
      .sort((a,b) => b.total - a.total);
    const tot = contas.reduce((acc, c) => {
      acc.servico += c.servico; acc.saque += (c.saque || 0);
      acc.convite += c.convite; acc.total += c.total;
      return acc;
    }, {servico:0, saque:0, convite:0, total:0});
    // Na janela curta nao existe "a receber": falta o saque, que so fecha por
    // dia. O que se mostra e o gerado.
    // O total sempre existe na mesma escala (o que a pessoa recebe), em
    // qualquer modo -- e o que impede o numero grande de mudar de significado
    // quando o jogador troca de atalho.
    return {...j, contas, ...tot, rakeback: rb(tot.total)};
  }).filter(j => j.total > 0)
    .sort((a,b) => b.rakeback - a.rakeback);

  renderContexto(curta, ini, fim);

  // O selo e um diagnostico do estado ATUAL da conta ("esta gerando indicacao
  // mas nao servico"). Olhando um periodo passado -- a segunda semana do mes
  // passado, por exemplo -- ele nao diz nada sobre aquele periodo e so confunde.
  // Entao so aparece quando o intervalo escolhido alcanca hoje (ou na janela
  // curta, que e sempre "agora").
  const mostrarSelo = curta ? true : fim >= HOJE;

  const lista = document.getElementById("lista");
  if (!linhas.length) {
    lista.innerHTML = curta
      ? `<div class="vazio">Nada gerado nas últimas ${textoJanela(curta)}.<br>
         Isso é normal fora do horário de jogo — experimente "Semana atual".</div>`
      : `<div class="vazio">Nenhuma comissão registrada neste período.<br>
         Tente um intervalo maior.</div>`;
    return;
  }
  lista.innerHTML = linhas.map((j, i) => {
    const avisos = mostrarSelo ? j.contas.filter(c => c.status).length : 0;
    return `
    <div class="jog" id="jog-${i}">
      <div class="jog-topo" onclick="document.getElementById('jog-${i}').classList.toggle('aberto')">
        <span class="jog-nome">${j.nome}${avisos ? '<span class="n-alertas"></span>' : ''}</span>
        <span class="jog-valor">${fmt(j.rakeback)}</span>
      </div>
      <div class="jog-resumo">
        <span>serviço <b>${fmt(rb(j.servico))}</b></span>
        <span>convite <b>${fmt(rb(j.convite))}</b></span>
        ${curta ? '' : `<span>saque <b>${fmt(rb(j.saque))}</b></span>`}
        <span><span class="seta">▸</span> ${j.contas.length} conta${j.contas.length>1?'s':''}</span>
      </div>
      <div class="detalhe"><div class="detalhe-int">
        ${j.contas.map(c => `
          <div class="conta-bloco">
            <div class="conta-linha">
              <span class="conta-id">${c.id}</span>
              <span class="conta-nome">${c.nome}</span>
              <span class="conta-val">${fmt(rb(c.total))}</span>
            </div>
            <div class="conta-partes">
              <span class="${c.servico?'':'zerado'}">serviço <b>${fmt(rb(c.servico))}</b></span>
              <span class="${c.convite?'':'zerado'}">convite <b>${fmt(rb(c.convite))}</b></span>
              ${curta ? '' : `<span class="${c.saque?'':'zerado'}">saque <b>${fmt(rb(c.saque))}</b></span>`}
            </div>
            ${mostrarSelo && c.status ? `<span class="selo ${c.status.chave==='convite_vencido'?'vencido':'parado'}">${c.status.texto}</span>
              ${detalheQuando(c.status)}` : ''}
          </div>`).join("")}
        <div class="conf">${curta
          ? `Comissão gerada nestas ${textoJanela(curta)}: ${fmt(j.total)} ·
             ${D.percentual}% = <b>${fmt(j.rakeback)}</b>. Ainda sem o saque, que só
             fecha no fim do dia. Confira se todas as suas contas apareceram aqui.`
          : `Comissão gerada no período: ${fmt(j.total)} ·
             ${D.percentual}% = <b>${fmt(j.rakeback)}</b>.
             Confira se todas as suas contas apareceram aqui.`}</div>
      </div></div>
    </div>`;
  }).join("");
}

// Faixa de contexto do topo.
//
// NUNCA colocar valor agregado aqui. Esta pagina e aberta por TODOS os
// jogadores com o mesmo link, entao qualquer soma geral seria "quanto a
// promotoria vai repassar no total" -- informacao do lado da promotoria, que o
// Erick ja tinha mandado tirar uma vez (o antigo card "Total a repassar").
// Eu recoloquei sem querer em 26/08 ao criar esta faixa para pendurar a
// regressiva; foi pego e removido no mesmo dia. O valor de cada pessoa
// aparece na linha dela, e so.
//
// O que esta faixa faz: dizer QUE PERIODO esta na tela e, na semana atual,
// quanto falta pra fechar.
function renderContexto(curta, ini, fim){
  const el = document.getElementById("contexto");
  const reg = document.getElementById("regressiva");

  // Cuidado de redacao que vale pra TODA frase desta pagina: nao afirmar como
  // certo o que depende de o jogador jogar. O valor PODE subir -- se ninguem
  // jogar, nao sobe. E saque nem acontece todo dia. Dizer "vai subir" seria
  // criar expectativa que a pagina nao controla.
  if (curta){
    reg.innerHTML = "";
    el.className = "contexto curto";
    el.innerHTML = `Mostra a comissão gerada nas <b>últimas ${textoJanela(curta)}</b>,
      com dados até <b>${hhmmBR(D.balde_ate * 1000)}</b>.
      Aqui entram serviço e convite; a parte do <b>saque</b> só é fechada no fim do dia,
      então este valor pode aumentar depois — se houver saque no período.`;
    return;
  }

  const [semIni, semFim] = semanaAtual();
  if (ini === semIni && fim === semFim){
    el.className = "contexto";
    el.innerHTML = `Esta é a <b>semana que está correndo</b> — de segunda 00:00
      a domingo 23:59, horário de Brasília.
      Para ver a semana anterior, já encerrada, use <b>"Semana fechada"</b>.`;
    atualizarRegressiva();
  } else if (ini === ultimaSemanaFechada()[0] && fim === ultimaSemanaFechada()[1]){
    reg.innerHTML = "";
    el.className = "contexto";
    el.innerHTML = `Esta é a <b>última semana fechada</b> — de segunda 00:00 a
      domingo 23:59, horário de Brasília. O período já encerrou, então os
      valores não mudam mais.`;
  } else {
    reg.innerHTML = "";
    el.className = "contexto";
    el.innerHTML = `Período escolhido: <b>${dt(ini)} a ${dt(fim)}</b>.`;
  }
}

function textoJanela(horas){
  if (Number.isInteger(horas)) return `${horas}h`;
  const h = Math.floor(horas), m = Math.round((horas - h) * 60);
  return h ? `${h}h${String(m).padStart(2,'0')}` : `${m}min`;
}

function atualizarRegressiva(){
  const el = document.getElementById("regressiva");
  if (!el || janelaCurtaAtiva) return;
  const [semIni, semFim] = semanaAtual();
  if (de.value !== semIni || ate.value !== semFim) return;  // so na semana atual
  const restaMs = fimDaSemanaAtual() - Date.now();
  if (restaMs <= 0){ el.innerHTML = "A semana está fechando agora."; return; }
  const h = Math.floor(restaMs / 3600000);
  const m = Math.floor((restaMs % 3600000) / 60000);
  const dias = Math.floor(h / 24);
  const txt = dias >= 1 ? `${dias}d ${h % 24}h` : `${h}h${String(m).padStart(2,'0')}`;
  el.innerHTML = `Fecha em <b>${txt}</b> — domingo 23:59, horário de Brasília.`;
}
setInterval(atualizarRegressiva, 30000);

// (o percentual agora e escrito junto com o texto de aviso, mais abaixo)

// Frescor: o jogador precisa saber se esta olhando numero velho. A pagina e
// estatica e o cache do navegador/CDN pode servir uma versao antiga sem avisar,
// entao mostramos a idade calculada no relogio dele, nao a hora de geracao.
function atualizarFrescor(){
  const el = document.getElementById("frescor");
  const val = document.getElementById("frescorval");
  const obs = document.getElementById("frescorobs");
  if (!D.gerado_iso) { val.textContent = D.gerado_em.split(" às ")[1]; obs.textContent = "atualizado"; return; }

  const min = Math.max(0, Math.round((Date.now() - new Date(D.gerado_iso)) / 60000));
  let texto;
  if (min < 1)        texto = "agora";
  else if (min === 1) texto = "há 1 min";
  else if (min < 60)  texto = `há ${min} min`;
  else if (min < 120) texto = "há 1 hora";
  else if (min < 1440) texto = `há ${Math.floor(min/60)} horas`;
  else                texto = `há ${Math.floor(min/1440)} dia${min >= 2880 ? "s" : ""}`;

  val.innerHTML = `<span class="ponto"></span>${texto}`;
  // Roda a cada 15 min; acima de 40 sinaliza que algo pode estar parado.
  el.classList.toggle("velho", min > 40);
  obs.textContent = min > 40 ? "pode estar desatualizado" : "atualizado";
}
atualizarFrescor();
setInterval(atualizarFrescor, 30000);

de.addEventListener("change", render);
ate.addEventListener("change", render);

// Abre na SEMANA ATUAL: a pergunta que o jogador tem e "quanto ja tenho pra
// receber", que e sobre a semana correndo. A semana fechada continua a um
// clique -- ela e a resposta certa so na segunda, antes do repasse sair.
const [aberturaIni, aberturaFim] = semanaAtual();
de.value = aberturaIni;
ate.value = aberturaFim;
render();

// Cada informacao ficou perto do que ela explica, em vez de num blocao unico:
// a escala (50%) fica na linha de conferencia de cada jogador, o significado
// de cada semana fica na faixa de contexto, e o fuso fica junto da regressiva.
// Aqui sobra so o que nao tem outro lugar natural.
// Redacao NEUTRA de proposito: nada de "sua parte", "repasse" ou "pagamento".
// Sao termos que carregam contexto de acordo comercial, e a tela nao precisa
// deles pra ser clara -- basta mostrar a operacao (comissao x 50%).
document.getElementById("lista").insertAdjacentHTML("beforebegin",
  `<div class="aviso-geral">Os valores mostrados já são <b>${D.percentual}% da
   comissão gerada</b>. Toque no seu nome pra ver as contas somadas — confira
   que nenhuma ficou de fora.</div>`);

document.getElementById("rodape").innerHTML =
  `Os números vêm de um computador que busca os dados sozinho, de tempos em tempos. ` +
  `O horário da última atualização fica sempre no topo da tela. ` +
  `<b>Se ele parar de avançar</b>, é porque essa máquina está fora do ar no momento — ` +
  `falta de luz, internet caiu, computador desligado — e ela volta a atualizar ` +
  `sozinha assim que voltar. Nada se perde nesse meio-tempo: o que você gerou ` +
  `continua registrado e aparece quando a atualização voltar.` +
  `<br><br><span style="color:var(--ink3)">Atualizado em ${D.gerado_em}.</span>`;
</script>
</body>
