<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rakeback</title>
<style>
  :root{
    --bg:#0D1712; --bg2:#0A120E; --card:#152019; --card2:#1B2A21; --line:#25382C;
    --ink:#ECF3ED; --ink2:#9FB5A7; --ink3:#6C8375;
    --ouro:#E4BE6E; --ouro-fundo:#3A2E17;
    --verde:#57CC93; --verde-fundo:#173226;
    --alerta:#E4A855; --alerta-fundo:#3A2C14;
    --info:#7FB3D9; --info-fundo:#152735;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at top,var(--bg) 0%,var(--bg2) 70%);
       color:var(--ink);font-family:var(--sans);padding:22px 14px 60px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:600px;margin:0 auto}
  .cabecalho{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:25px;margin:0;letter-spacing:-.02em;font-weight:750}
  .periodo{color:var(--ink2);font-size:13.5px;margin-top:5px}
  .frescor{text-align:right;font-size:11px;color:var(--ink3);white-space:nowrap;
           padding-top:4px}
  .frescor b{color:var(--ink2);display:block;font-size:12px}
  .aviso-geral{margin:16px 0 20px;padding:11px 14px;background:var(--card2);
         border-left:3px solid var(--ouro);border-radius:3px;
         font-size:12.5px;color:var(--ink2);line-height:1.5}
  .jog{background:var(--card);border:1px solid var(--line);border-radius:12px;
       margin-bottom:11px;overflow:hidden}
  .jog-topo{display:flex;justify-content:space-between;align-items:center;
            gap:12px;padding:15px 17px;cursor:pointer;user-select:none}
  .jog-nome{font-size:17px;font-weight:650}
  .jog-nome .n-alertas{display:inline-block;margin-left:7px;width:8px;height:8px;
       border-radius:50%;background:var(--alerta);vertical-align:middle}
  .jog-valor{font-family:var(--mono);font-size:22px;font-weight:750;color:var(--verde);
         font-variant-numeric:tabular-nums;white-space:nowrap}
  .jog-resumo{display:flex;gap:14px;flex-wrap:wrap;padding:0 17px 14px;
           font-size:12px;color:var(--ink3)}
  .jog-resumo b{color:var(--ink2);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .seta{display:inline-block;font-size:11px;color:var(--ink3);transition:transform .15s}
  .jog.aberto .seta{transform:rotate(90deg)}
  .detalhe{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .jog.aberto .detalhe{max-height:600px}
  .detalhe-int{border-top:1px solid var(--line);padding:13px 17px 15px}
  .conta-linha{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;
              flex-wrap:wrap}
  .conta-id{font-family:var(--mono);color:var(--ink3);font-size:11px;min-width:80px}
  .conta-nome{flex:1;min-width:100px;color:var(--ink2)}
  .conta-val{font-family:var(--mono);font-size:12.5px;color:var(--ink2);
             font-variant-numeric:tabular-nums}
  .selo{font-size:10.5px;padding:2px 8px;border-radius:9px;font-weight:650;
        display:block;margin-top:5px;width:fit-content}
  .selo.vencido{background:var(--alerta-fundo);color:var(--alerta)}
  .selo.parado{background:var(--info-fundo);color:var(--info)}
  .conf{font-size:11.5px;color:var(--ink3);margin-top:10px;padding-top:10px;
        border-top:1px dashed var(--line)}
  .vazio{padding:34px 16px;text-align:center;color:var(--ink3);font-size:14px}
  .rodape{margin-top:24px;color:var(--ink3);font-size:11px;line-height:1.6;
          border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cabecalho">
    <div>
      <h1>Rakeback</h1>
      <div class="periodo" id="periodo"></div>
    </div>
    <div class="frescor"><b id="frescorval"></b>atualizado</div>
  </div>

  <div class="aviso-geral">
    Valores de <b id="pct"></b> sobre a comissão gerada no período.
    Toque no seu nome pra ver as contas somadas — confira que nenhuma ficou de fora.
  </div>

  <div id="lista"></div>
  <div id="rodape" class="rodape"></div>
</div>

<script>
const D = {"inicio": "2026-08-17", "fim": "2026-08-17", "percentual": 50, "jogadores": [{"nome": "Caio", "servico": 5.52, "saque": 9.36, "convite": 9.41, "total": 24.3, "rakeback": 12.15, "contas": [{"id": "20909143", "nome": "chup chup", "total": 16.27, "status": null}, {"id": "20909001", "nome": "manga de ouro", "total": 6.21, "status": null}, {"id": "20906293", "nome": "vuc vuc", "total": 1.82, "status": null}], "avisos": []}, {"nome": "Takeshita", "servico": 0.59, "saque": 0.0, "convite": 1.03, "total": 1.61, "rakeback": 0.81, "contas": [{"id": "20822923", "nome": "Kenji Takeshita", "total": 1.61, "status": null}], "avisos": []}, {"nome": "Maior do Brasil", "servico": 0.31, "saque": 0.0, "convite": 1.12, "total": 1.43, "rakeback": 0.72, "contas": [{"id": "20759275", "nome": "TrancosoPoker", "total": 1.43, "status": null}, {"id": "5194671", "nome": "5194671", "total": 0, "status": null}], "avisos": []}, {"nome": "Fabio", "servico": 0.39, "saque": 0.0, "convite": 0.73, "total": 1.12, "rakeback": 0.56, "contas": [{"id": "20891125", "nome": "CAPIVARA.PIRA", "total": 1.12, "status": null}, {"id": "20891306", "nome": "20891306", "total": 0, "status": null}, {"id": "20891317", "nome": "20891317", "total": 0, "status": null}], "avisos": []}], "gerado_em": "17/08/2026 às 00:27"};
const fmt = v => Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const dt = s => s.split("-").reverse().join("/");

document.getElementById("periodo").textContent = `${dt(D.inicio)} a ${dt(D.fim)}`;
document.getElementById("pct").textContent = D.percentual + "%";
document.getElementById("frescorval").textContent = D.gerado_em.split(" às ")[1];

const lista = document.getElementById("lista");
if (!D.jogadores.length) {
  lista.innerHTML = `<div class="vazio">Nenhuma comissão registrada neste período.</div>`;
} else {
  lista.innerHTML = D.jogadores.map((j, i) => `
    <div class="jog" id="jog-${i}">
      <div class="jog-topo" onclick="document.getElementById('jog-${i}').classList.toggle('aberto')">
        <span class="jog-nome">${j.nome}${j.avisos.length ? '<span class="n-alertas"></span>' : ''}</span>
        <span class="jog-valor">${fmt(j.rakeback)}</span>
      </div>
      <div class="jog-resumo">
        <span>serviço <b>${fmt(j.servico)}</b></span>
        <span>convite <b>${fmt(j.convite)}</b></span>
        <span>saque <b>${fmt(j.saque)}</b></span>
        <span><span class="seta">▸</span> ${j.contas.length} conta${j.contas.length>1?'s':''}</span>
      </div>
      <div class="detalhe"><div class="detalhe-int">
        ${j.contas.map(c => `
          <div class="conta-linha">
            <span class="conta-id">${c.id}</span>
            <span class="conta-nome">${c.nome}</span>
            <span class="conta-val">${fmt(c.total)}</span>
            ${c.status ? `<span class="selo ${c.status.chave==='convite_vencido'?'vencido':'parado'}">${c.status.texto}</span>` : ''}
          </div>`).join("")}
        <div class="conf">Total gerado no período: ${fmt(j.total)} · 50% = ${fmt(j.rakeback)}.
          Confira se todas as suas contas apareceram aqui.</div>
      </div></div>
    </div>`).join("");
}

document.getElementById("rodape").textContent =
  `Atualizado em ${D.gerado_em}. Os valores mudam conforme o jogo acontece — ` +
  `esta página mostra o que estava registrado na última atualização, não em tempo real.`;
</script>
</body>
</html>
